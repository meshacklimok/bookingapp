name: bookingapp
description: Multi-purpose booking app for appointments, events and resources, with M-Pesa and Paystack payments and QR tickets.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  supabase_flutter: ^2.8.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
